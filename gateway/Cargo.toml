[package]
name = "agverse-gateway"
version = "0.1.0"
edition = "2024"
description = "HTTP gateway for hosting Agverse agents remotely (Cursor Cloud Agents API–inspired)"

[[bin]]
name = "agverse-gateway"
path = "src/main.rs"

[dependencies]
agent_core = { path = "../core", default-features = false }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
