[package]
name = "agent_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_core"
path = "src/lib.rs"

[[bin]]
name = "agent-cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tiktoken-rs = "0.6"
jsonschema = "0.28"
fastembed = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
 termimad = "0.34"
ratatui = "0.30"
crossterm = "0.29"
argh = "0.1"
unicode-width = "0.2"
  glob = "0.3"

[dev-dependencies]
tempfile = "3"
