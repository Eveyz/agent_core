[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "ageverse"
path = "src/main.rs"

[dependencies]
agent_core = { path = "../core", default-features = false }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
termimad = "0.34"
ratatui = "0.30"
crossterm = "0.29"
argh = "0.1"
unicode-width = "0.2"
rustyline = { version = "15", features = ["derive"] }
pulldown-cmark = "0.13"
syntect = { version = "5", features = ["default-syntaxes", "default-themes"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-util = "0.7.18"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
arboard = "3"
