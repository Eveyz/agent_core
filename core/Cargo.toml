[package]
name = "agent_core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["stream", "json", "gzip", "brotli"] }
readability = "0.3"
htmd = "0.1"
url = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
jsonschema = "0.28"
fastembed = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
glob = "0.3"
similar = "2"
tracing = "0.1.44"
libc = "0.2"
tokio-util = "0.7.18"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
