[package]
name = "agent_core"
version = "0.1.0"
edition = "2024"

[features]
default = ["embeddings"]
# ONNX-backed vector embeddings for memory recall (fastembed). Disable for slim CLI/Harbor builds.
embeddings = ["dep:fastembed"]

[dependencies]
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["stream", "json", "gzip", "brotli", "cookies"] }
readability = "0.3"
htmd = "0.1"
url = "2"
rand = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
jsonschema = "0.28"
fastembed = { version = "5", optional = true }
rusqlite = { version = "0.39", features = ["bundled"] }
tantivy = { version = "0.22", features = ["mmap"] }
instant-distance = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
glob = "0.3"
similar = "2"
tracing = "0.1.44"
libc = "0.2"
tokio-util = "0.7.18"
parking_lot = "0.12"
tiktoken-rs = "0.12"
robotstxt = "0.3.0"
tokio-cron-scheduler = "0.15.1"
tempfile = "3"
