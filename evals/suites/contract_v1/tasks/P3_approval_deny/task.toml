id = "P3_approval_deny"
bucket = "permission"
prompt = "Write bye to out.txt"
driver = "run"
approval = "auto_deny"
permission_mode = "standard"
max_iterations = 5
timeout_secs = 60

[grader]
kind = "expect_events"
require_events = ["approval_required", "approval_resolved"]
forbid_fail_tags = ["approval_deadlock", "hung_no_terminal"]
